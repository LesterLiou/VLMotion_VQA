name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        # Private SSH submodules are audited separately; no GPU/model downloads.
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/check.sh
