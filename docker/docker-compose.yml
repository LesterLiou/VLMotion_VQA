services:
  vlpoint-inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vlpoint-inference
    hostname: vlpoint-dev
    restart: unless-stopped
    gpus: all
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - HF_HOME=/root/.cache/huggingface
    volumes:
      # - ../models:/workspace/models:ro  # 模型目錄（只讀）
      - ../:/workspace
      - ../.cache/huggingface:/root/.cache/huggingface
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # X11 支援（如果需要）
      - /dev/dri:/dev/dri:rw  # GPU access for hardware acceleration
      # RealSense 會建立多個動態 video/HID 裝置；掛載整個 USB bus，
      # 避免相機未插入時 Docker 將 /dev/videoN 建成一般目錄。
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
    network_mode: "host"
    privileged: true
    group_add:
      - video  # 添加到 video 群組以獲得攝影機權限
    stdin_open: true
    tty: true
